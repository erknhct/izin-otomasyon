<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Outer rope border pattern -->
    <pattern id="rope" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#e11d48"/>
      <rect x="6" width="6" height="12" fill="#be123c"/>
    </pattern>
    <!-- Circular Text Paths -->
    <path id="textPathTop" d="M 65,200 A 135,135 0 1,1 335,200" />
    <path id="textPathBottom" d="M 335,200 A 135,135 0 0,1 65,200" />
    <!-- Star definition -->
    <g id="star">
      <polygon points="0,-12 3.5,-3.6 11.4,-3.6 5,-1 7.4,6.4 0,1.8 -7.4,6.4 -5,-1 -11.4,-3.6 -3.5,-3.6" fill="#e11d48"/>
    </g>
  </defs>

  <!-- Clean White Disc Fill inside seal r=192 -->
  <circle cx="200" cy="200" r="190" fill="#ffffff" />

  <!-- Outer Braided/Rope Ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="#e11d48" stroke-width="8" stroke-dasharray="6,4"/>
  <circle cx="200" cy="200" r="183" fill="none" stroke="#e11d48" stroke-width="2"/>

  <!-- 16 Stars Ring -->
  <g transform="translate(200,200)">
    <use href="#star" transform="rotate(0) translate(0,-162)"/>
    <use href="#star" transform="rotate(22.5) translate(0,-162)"/>
    <use href="#star" transform="rotate(45) translate(0,-162)"/>
    <use href="#star" transform="rotate(67.5) translate(0,-162)"/>
    <use href="#star" transform="rotate(90) translate(0,-162)"/>
    <use href="#star" transform="rotate(112.5) translate(0,-162)"/>
    <use href="#star" transform="rotate(135) translate(0,-162)"/>
    <use href="#star" transform="rotate(157.5) translate(0,-162)"/>
    <use href="#star" transform="rotate(180) translate(0,-162)"/>
    <use href="#star" transform="rotate(202.5) translate(0,-162)"/>
    <use href="#star" transform="rotate(225) translate(0,-162)"/>
    <use href="#star" transform="rotate(247.5) translate(0,-162)"/>
    <use href="#star" transform="rotate(270) translate(0,-162)"/>
    <use href="#star" transform="rotate(292.5) translate(0,-162)"/>
    <use href="#star" transform="rotate(315) translate(0,-162)"/>
    <use href="#star" transform="rotate(337.5) translate(0,-162)"/>
  </g>

  <!-- Inner Concentric Ring Borders -->
  <circle cx="200" cy="200" r="142" fill="none" stroke="#e11d48" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="102" fill="none" stroke="#e11d48" stroke-width="2.5"/>

  <!-- Circular Text inside Ring -->
  <text font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="19" fill="#e11d48" letter-spacing="2">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">ANKARA ADLİYESİ BİLGİ İŞLEM MÜDÜRLÜĞÜ</textPath>
  </text>

  <!-- Center Solid Red Circle -->
  <circle cx="200" cy="200" r="100" fill="#e11d48" />

  <!-- Center Symbols: Crescent & Star, Sword & Scales, Open Book -->
  <g fill="#ffffff">
    <!-- Crescent & Star at top of red circle -->
    <path d="M 197 122 A 11 11 0 1 0 209 138 A 9 9 0 1 1 197 122 Z" />
    <polygon points="208,127 210,131 214,131 211,133 212,137 208,134 204,137 205,133 202,131 206,131" />

    <!-- Central Sword -->
    <rect x="198.5" y="145" width="3" height="60" rx="1.5"/>
    <!-- Guard -->
    <rect x="186" y="152" width="28" height="3" rx="1.5"/>
    <!-- Pommel -->
    <circle cx="200" cy="207" r="3.5"/>

    <!-- Scales (Left & Right Pans) -->
    <!-- Left Scale Beam -->
    <line x1="200" y1="153" x2="162" y2="165" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right Scale Beam -->
    <line x1="200" y1="153" x2="238" y2="165" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Left Strings & Pan -->
    <line x1="162" y1="165" x2="152" y2="182" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="162" y1="165" x2="172" y2="182" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 150,182 Q 162,192 174,182 Z"/>

    <!-- Right Strings & Pan -->
    <line x1="238" y1="165" x2="228" y2="182" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="238" y1="165" x2="248" y2="182" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M 226,182 Q 238,192 250,182 Z"/>

    <!-- Open Book at Bottom -->
    <path d="M 200,202 Q 170,192 145,200 L 145,216 Q 170,208 200,218 Q 230,208 255,216 L 255,200 Q 230,192 200,202 Z" />
    <path d="M 200,205 Q 170,196 148,203 L 148,214 Q 170,207 200,215 Q 230,207 252,214 L 252,203 Q 230,196 200,205 Z" fill="#e11d48"/>
  </g>
</svg>
